<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Bot Config</title>
    <style>
        body { background-color: #0b1120; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 20px; max-width: 500px; margin: 0 auto; }
        label { display: block; margin-top: 15px; color: #38bdf8; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px; background: #030712; border: 1px solid #374151; color: #fff; border-radius: 6px; box-sizing: border-box; margin-top: 5px; }
        button { width: 100%; margin-top: 20px; padding: 12px; background: #0284c7; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ Main Bot Config</h2>
    <form id="configForm">
        <label>Main Bot Token</label>
        <input type="text" id="botToken" placeholder="123456:ABC..." required>

        <label>Webhook Domain URL</label>
        <input type="url" id="webhookUrl" placeholder="https://your-domain.com">

        <label>Videos Per Level</label>
        <input type="number" id="videosPerLevel" value="3">

        <label>Welcome Message</label>
        <textarea id="welcomeMessage" rows="3"></textarea>

        <label>Channel Lock Text</label>
        <input type="text" id="channelLockText">

        <label>Referral Target</label>
        <input type="number" id="referralTarget" value="5">

        <label>Delete Time (sec)</label>
        <input type="number" id="deleteTime" value="10">

        <label>Bot Username (no @)</label>
        <input type="text" id="botUsername" placeholder="MyBot">

        <label>Welcome Media (File ID)</label>
        <input type="text" id="welcomeMediaId">

        <label>Media Type</label>
        <select id="mediaType">
            <option value="Photo">Photo</option>
            <option value="Video">Video</option>
        </select>

        <button type="submit">✓ SAVE MAIN BOT SETTINGS</button>
    </form>
</div>

<script>
    // তথ্য লোড করা
    async function loadSettings() {
        const res = await fetch('/api/bot-config/get');
        const result = await res.json();
        if(result.success && result.data) {
            const d = result.data;
            document.getElementById('botToken').value = d.botToken || '';
            document.getElementById('webhookUrl').value = d.webhookUrl || '';
            document.getElementById('videosPerLevel').value = d.videosPerLevel || 3;
            document.getElementById('welcomeMessage').value = d.welcomeMessage || '';
            document.getElementById('channelLockText').value = d.channelLockText || '';
            document.getElementById('referralTarget').value = d.referralTarget || 5;
            document.getElementById('deleteTime').value = d.deleteTime || 10;
            document.getElementById('botUsername').value = d.botUsername || '';
            document.getElementById('welcomeMediaId').value = d.welcomeMediaId || '';
            document.getElementById('mediaType').value = d.mediaType || 'Video';
        }
    }

    // তথ্য সেভ করা
    document.getElementById('configForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            botToken: document.getElementById('botToken').value,
            webhookUrl: document.getElementById('webhookUrl').value,
            videosPerLevel: document.getElementById('videosPerLevel').value,
            welcomeMessage: document.getElementById('welcomeMessage').value,
            channelLockText: document.getElementById('channelLockText').value,
            referralTarget: document.getElementById('referralTarget').value,
            deleteTime: document.getElementById('deleteTime').value,
            botUsername: document.getElementById('botUsername').value,
            welcomeMediaId: document.getElementById('welcomeMediaId').value,
            mediaType: document.getElementById('mediaType').value
        };

        const res = await fetch('/api/bot-config/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        alert(result.message);
    });

    loadSettings();
</script>
</body>
</html>
