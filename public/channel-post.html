<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Post</title>
    <style>
        body { background-color: #0b1120; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; max-width: 480px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 24px; }
        .back-btn { position: absolute; left: 0; background: #1f2937; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; text-decoration: none; }
        h2 { font-size: 18px; font-weight: 600; margin: 0; }
        label { display: block; margin-top: 16px; color: #38bdf8; font-size: 13px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 12px; background: #030712; border: 1px solid #1f2937; color: #fff; border-radius: 8px; box-sizing: border-box; margin-top: 6px; font-size: 14px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: #0284c7; }
        textarea { height: 90px; resize: vertical; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }
        button.publish-btn { width: 100%; margin-top: 24px; padding: 14px; background: #0284c7; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.publish-btn:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <a href="/admin/dashboard" class="back-btn">←</a>
        <h2>Channel Post</h2>
    </div>

    <form id="channelPostForm">
        <label>Target Channel ID</label>
        <input type="text" id="channelId" placeholder="-100xxxxxxxxxx" required>

        <label>Caption / Message</label>
        <textarea id="caption" placeholder="Write your post message here..."></textarea>

        <label>Media (File ID or Link)</label>
        <input type="text" id="mediaUrl" placeholder="https://... or Telegram File ID">

        <select id="mediaType">
            <option value="Photo">Photo</option>
            <option value="Video">Video</option>
            <option value="Document">Document</option>
        </select>

        <div class="row">
            <div>
                <label>Button Text</label>
                <input type="text" id="buttonText" placeholder="Join Channel">
            </div>
            <div>
                <label>Button URL</label>
                <input type="text" id="buttonUrl" placeholder="https://t.me/...">
            </div>
        </div>

        <button type="submit" id="btnSubmit" class="publish-btn">✈ PUBLISH</button>
    </form>
</div>

<script>
    document.getElementById('channelPostForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        
        const payload = {
            channelId: document.getElementById('channelId').value,
            caption: document.getElementById('caption').value,
            mediaUrl: document.getElementById('mediaUrl').value,
            mediaType: document.getElementById('mediaType').value,
            buttonText: document.getElementById('buttonText').value,
            buttonUrl: document.getElementById('buttonUrl').value
        };

        btn.disabled = true;
        btn.innerText = 'Publishing...';

        try {
            const res = await fetch('/api/channel-post/publish', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            alert(result.message);
            if(result.success) {
                document.getElementById('channelPostForm').reset();
            }
        } catch (error) {
            alert('Error publishing post: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = '✈ PUBLISH';
        }
    });
</script>
</body>
</html>
